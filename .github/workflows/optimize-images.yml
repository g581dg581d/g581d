name: Optimize portfolio images

on:
  push:
    branches:
      - main
    paths:
      - "images/**/*.jpg"
      - "images/**/*.jpeg"
      - "images/**/*.png"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Create responsive WebP files
        shell: bash
        run: |
          set -e
          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0 | while IFS= read -r -d "" file; do
            base="${file%.*}"
            cwebp -quiet -q 82 -resize 1280 0 "$file" -o "${base}-1280.webp"
            cwebp -quiet -q 82 -resize 1920 0 "$file" -o "${base}-1920.webp"
            cwebp -quiet -q 82 "$file" -o "${base}-2560.webp"
          done

      - name: Commit optimized images
        shell: bash
        run: |
          if git status --short | grep -q "\.webp"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/*.webp
            git commit -m "Generate responsive WebP images"
            git push
          else
            echo "No WebP changes to commit."
          fi
